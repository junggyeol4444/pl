# AchievementSystem 설정 파일
# Paper 1.20.4+ 전용 업적 시스템 플러그인

settings:
  # 업적 달성 시 서버 전체 공지 여부
  broadcast-on-achievement: true
  # 업적 달성 시 타이틀 표시 여부
  show-title: true
  # 업적 달성 시 사운드 재생 여부
  play-sound: true
  # 업적 달성 시 파티클 효과 여부
  show-particles: true
  # 채팅에 칭호 표시 여부
  show-prefix-in-chat: true
  # 데이터 자동 저장 주기 (틱, 20틱=1초, 기본 6000틱=5분)
  auto-save-interval: 6000
  # 언어 설정 (현재 ko_KR만 지원)
  language: ko_KR

# 업적 정의
# 형식:
# achievements:
#   <업적_ID>:
#     name: <표시 이름>
#     description: <설명>
#     category: <카테고리: MINING|COMBAT|EXPLORATION|BUILDING|SOCIAL>
#     icon: <아이콘 아이템>
#     hidden: <숨김 여부: true|false>
#     reward:
#       exp: <경험치>
#       items: <아이템 목록>
#       title: <칭호>
#     condition:
#       type: <조건 유형>
#       value: <목표 값>

